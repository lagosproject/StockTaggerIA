name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Code Quality & Linting
  # --------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Go module dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 2. Multiplatform Build & Test Matrix
  #    Supports Ubuntu, macOS, Windows x64 and Windows on ARM64 (Qualcomm Snapdragon)
  # --------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (${{ matrix.target.name }})
    needs: [lint]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: stocktaggeria
            artifact_name: stocktaggeria-linux-amd64
            run_tests: true
            test_cgo: "1"
            race: "-race"
          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: stocktaggeria
            artifact_name: stocktaggeria-darwin-arm64
            run_tests: true
            test_cgo: "0"
            race: ""
          - name: Windows x64
            os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: stocktaggeria.exe
            artifact_name: stocktaggeria-windows-amd64
            run_tests: true
            test_cgo: "0"
            race: ""
          - name: Windows ARM64 (Qualcomm Snapdragon / Surface ARM)
            os: ubuntu-latest
            goos: windows
            goarch: arm64
            binary_name: stocktaggeria_arm64.exe
            artifact_name: stocktaggeria-windows-arm64
            run_tests: false
            test_cgo: "0"
            race: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Validate Environment Secrets
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is configured in GitHub Secrets (length: ${#GEMINI_API_KEY} characters)."
          else
            echo "::notice ::GEMINI_API_KEY secret is not configured in this repository; mock key will be used for automated tests."
          fi

      - name: Run Unit Tests with Coverage
        if: ${{ matrix.target.run_tests }}
        env:
          CGO_ENABLED: ${{ matrix.target.test_cgo }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_mock_test_key' }}
        shell: bash
        run: |
          go test -v ${{ matrix.target.race }} -coverprofile=coverage-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.txt -covermode=atomic ./...

      - name: Upload Test Coverage
        if: ${{ matrix.target.run_tests && matrix.target.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: coverage-*.txt
          retention-days: 7

      - name: Compile Multiplatform Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.target.binary_name }} ./src/main.go

      - name: Verify Binary Output
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.target.binary_name }}" ]; then
            echo "Artifact dist/${{ matrix.target.binary_name }} built successfully."
            ls -lh dist/${{ matrix.target.binary_name }}
          else
            echo "Binary dist/${{ matrix.target.binary_name }} not found!"
            exit 1
          fi

      - name: Upload Platform Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: dist/${{ matrix.target.binary_name }}
          retention-days: 14

  # --------------------------------------------------------------------------
  # 3. Publish GitHub Release with Assets (Triggered on Version Tags 'v*')
  # --------------------------------------------------------------------------
  release:
    name: Publish Official GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Release Archives & Compute Checksums
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          mkdir -p release-dist

          # Package Linux x64
          tar -czf release-dist/stocktaggeria_${VERSION}_linux_amd64.tar.gz -C artifacts/stocktaggeria-linux-amd64 stocktaggeria README.md LICENSE .env.example

          # Package macOS ARM64
          tar -czf release-dist/stocktaggeria_${VERSION}_darwin_arm64.tar.gz -C artifacts/stocktaggeria-darwin-arm64 stocktaggeria README.md LICENSE .env.example

          # Package Windows x64
          (cd artifacts/stocktaggeria-windows-amd64 && zip -9 ../../release-dist/stocktaggeria_${VERSION}_windows_amd64.zip stocktaggeria.exe)
          zip -u -j release-dist/stocktaggeria_${VERSION}_windows_amd64.zip README.md LICENSE .env.example

          # Package Windows ARM64 (Qualcomm Snapdragon)
          (cd artifacts/stocktaggeria-windows-arm64 && zip -9 ../../release-dist/stocktaggeria_${VERSION}_windows_arm64.zip stocktaggeria_arm64.exe)
          zip -u -j release-dist/stocktaggeria_${VERSION}_windows_arm64.zip README.md LICENSE .env.example

          # Package Lightroom Classic Lua Plugin
          (cd lrplugin && zip -r ../release-dist/StockTaggerIA-LightroomPlugin_v${VERSION}.zip StockTaggerIA.lrplugin)

          # Generate SHA256 Checksums
          (cd release-dist && sha256sum * > checksums.txt)

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
