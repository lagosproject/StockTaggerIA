name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1. Code Quality & Linting
  # --------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Go module dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 2. Multiplatform Build & Test Matrix
  #    Supports Ubuntu, macOS, Windows x64 and Windows on ARM64 (Qualcomm Snapdragon)
  # --------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (${{ matrix.target.name }})
    needs: [lint]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: stocktaggeria
            run_tests: true
          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: stocktaggeria
            run_tests: true
          - name: Windows x64
            os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: stocktaggeria.exe
            run_tests: true
          - name: Windows ARM64 (Qualcomm Snapdragon / Surface ARM)
            os: ubuntu-latest
            goos: windows
            goarch: arm64
            binary_name: stocktaggeria_arm64.exe
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Validate Environment Secrets
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is configured in GitHub Secrets (length: ${#GEMINI_API_KEY} characters)."
          else
            echo "::notice ::GEMINI_API_KEY secret is not configured in this repository; mock key will be used for automated tests."
          fi

      - name: Run Unit Tests with Coverage
        if: ${{ matrix.target.run_tests }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_mock_test_key' }}
        shell: bash
        run: |
          go test -v -race -coverprofile=coverage-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.txt -covermode=atomic ./...

      - name: Upload Test Coverage
        if: ${{ matrix.target.run_tests && matrix.target.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: coverage-*.txt
          retention-days: 7

      - name: Compile Multiplatform Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.target.binary_name }} ./src/main.go

      - name: Verify Binary Output
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.target.binary_name }}" ]; then
            echo "Artifact dist/${{ matrix.target.binary_name }} built successfully."
            ls -lh dist/${{ matrix.target.binary_name }}
          else
            echo "Binary dist/${{ matrix.target.binary_name }} not found!"
            exit 1
          fi

      - name: Upload Platform Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}-binary
          path: dist/${{ matrix.target.binary_name }}
          retention-days: 14
